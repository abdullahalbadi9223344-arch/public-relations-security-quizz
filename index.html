<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>اختبار العلاقات العامة والإعلام الأمني</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mu:#5b6478;--pr:#1a5fa8;--bd:#dbe1ee;--ok:#1f7a4d;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--tx:#e8ecf6;--mu:#9aa5bf;--pr:#6aa6ec;--bd:#2a3556;--ok:#5fcf97;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--tx:#e8ecf6;--mu:#9aa5bf;--pr:#6aa6ec;--bd:#2a3556;--ok:#5fcf97;--no:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}button{-webkit-appearance:none;appearance:none;touch-action:manipulation;font-size:16px}.opt.sel{background:#e3eefb}.opt.ok{background:#e0f3e8}.opt.no{background:#fbe4e2}.grid .d{color:#fff}@media(max-width:480px){main{padding:10px}.card{padding:14px}h1{font-size:1.3rem}.grid button{min-width:40px;min-height:40px}}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:1.6rem;color:var(--pr);margin:.2em 0}h2{font-size:1.15rem;margin:.2em 0}
.mu{color:var(--mu)}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:12px 16px;min-height:48px}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:right;margin:8px 0}.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--card))}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.grid button{min-height:36px;padding:4px 10px;flex:none}.grid .d{background:var(--pr);color:#fff}
.big{font-size:2rem;color:var(--pr);font-weight:700}.ex{background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:10px}
.tag{font-size:.8rem;color:var(--pr)}.g{color:var(--ok)}.r{color:var(--no)}
label.m{display:flex;gap:8px;align-items:center;margin:12px 0}

/* نشر عام + هاتف: تحسينات responsive وإتاحة */
html,body{min-height:100%;overflow-x:hidden}
body{overscroll-behavior-y:contain}
main{width:100%;max-width:820px;padding:clamp(10px,3vw,24px);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{box-shadow:0 4px 18px rgba(20,33,61,.06)}
button{min-height:50px}
.opt{min-height:54px;line-height:1.65}
.grid{justify-content:center}
.grid button{min-width:42px}
@media(max-width:600px){
  body{font-size:15px}
  main{padding:10px 9px 20px}
  .card{padding:14px 12px;border-radius:12px;margin-bottom:10px}
  h1{font-size:1.25rem;line-height:1.5}
  h2{font-size:1.05rem;line-height:1.7}
  .row{gap:7px}
  .row button{flex:1;min-width:0;padding:11px 8px}
  .opt{font-size:15px;text-align:right;padding:12px 11px;min-height:52px}
  .grid{gap:5px}
  .grid button{min-width:38px;min-height:38px;padding:3px 7px;font-size:14px}
  .big{font-size:1.65rem}
  .ex{padding:9px 10px;font-size:14px}
}
@media(min-width:601px){body{padding-top:10px}}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--pr) 35%,transparent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>

<script>
const T=["تعريف العلاقات العامة","التمييز بين المفاهيم","الدعاية","التخطيط الاستراتيجي","الجمهور والقنوات","التقييم","البروتوكول"];
// [موضوع، سؤال، خيارات، index الصحيح، شرح]
const Q=[
[0,"أي تعريف يرفع العلاقات العامة من «تنفيذ اتصالي» إلى «مكوّن إداري يسبق القرار ويصاحبه»؟",["تعريف جمعية العلاقات العامة الأمريكية","تعريف يبدأ من العلاقة الاجتماعية فقط","تعريف الجمعية الدولية للعلاقات العامة","تعريف يبدأ من الاتصال وحده"],2,"الجمعية الدولية تصفها بممارسة إدارية لصنع القرار تُكلَّف ببناء العلاقات وحماية المصالح عبر تواصل موثوق وأخلاقي."],
[0,"كيف تفسَّر الشرائح اختلاف تعريفات العلاقات العامة؟",["تناقض يدل على ضعف المفهوم","اختلاف في زاوية النظر ينتج نموذجًا عمليًا مختلفًا","خطأ في بعض التعريفات يجب تجاهله","اختلاف في الأدوات المستخدمة فقط"],1,"الاختلاف ليس تناقضًا؛ فبعضها يبدأ من الاتصال، وبعضها من الإدارة أو العلاقة الاجتماعية أو الأخلاق المهنية."],
[0,"ما الذي يميز تعريف الجمعية الأمريكية؟",["يجعل الاتصال الاستراتيجي محورًا مركزيًا ويربط نجاحه بمخرجات العلاقة","يعدّها وظيفة إدارية تسبق القرار","يحصرها في الإعلان عن الخدمات","يركز على حماية السمعة دون الجمهور"],0,"تعرّفها كعملية اتصال استراتيجية تبني علاقات نافعة متبادلة بين المنظمات وجماهيرها."],
[0,"ما المقصود بالحوكمة الاتصالية في البيئة الشرطية؟",["زيادة عدد المتحدثين الرسميين","تحديد من يتحدث ومتى وكيف والصياغات والقنوات المعتمدة","نشر كل المعلومات فور حدوثها","ترك كل إدارة تتواصل بأسلوبها"],1,"البيئة الشرطية توازن بين حق الجمهور في المعرفة وحماية الخصوصية وسلامة التحقيق، وهنا تصبح الحوكمة الاتصالية ضرورية."],
[1,"لماذا يظل الإعلام مختلفًا عن العلاقات العامة حتى لو نقل بيانًا صادرًا عنها؟",["لأنه لا يستخدم الوسائل نفسها","لأن هدفه الأساسي خدمة حق الجمهور في المعرفة لا حماية سمعة المؤسسة","لأنه لا يهتم بالدقة","لأنه يعمل بمنطق ترويجي"],1,"الأداة المشتركة لا تعني الطبيعة المشتركة؛ فغاية الإعلام خدمة حق الجمهور في المعرفة."],
[1,"سأل صحفي: «هل المشتبه به معروف لديكم؟ وما اسمه؟». ما الاستجابة المهنية وفق الشفافية الإجرائية؟",["لا تعليق","الإفصاح عن الاسم لقطع الشائعات","بيان أن التحقيق جارٍ وتعذّر نشر ما يضر العدالة أو الخصوصية، وأن المعلومات ستعلن رسميًا لاحقًا، مع توجيه الجمهور لما يفعله","تجاهل السؤال حتى انتهاء التحقيق"],2,"عبارة «لا تعليق» تترك فراغًا تملؤه الشائعة؛ لذا تُقدَّم شفافية إجرائية مع توجيه الجمهور (مثل عدم تداول صور أو أسماء)."],
[1,"حملة توعوية للسلامة المرورية بتصميم إعلاني لا تستهدف ربحًا تجاريًا. كيف تُصنَّف؟",["إعلان تجاري بالمعنى التسويقي","دعاية رمادية","إعلام استقصائي","تسويق اجتماعي أو إعلان للخدمة العامة"],3,"وجود رسالة توعوية لا يجعلها إعلانًا تسويقيًا؛ فهي تتبنى أدوات الإعلان لكنها تستهدف مصلحة عامة."],
[1,"أي المؤشرات أقرب لقياس الإعلان وليس العلاقات العامة؟",["الثقة والرضا","الفهم والاستعداد للتعاون","التذكّر أو النقر والتكرار","القبول المجتمعي طويل المدى"],2,"الإعلان يميل لمؤشرات استجابة (الوصول، التكرار، التذكر، النقر)، بينما تُقاس العلاقات العامة غالبًا بنتائج علائقية."],
[2,"ما أخطر أنواع الدعاية في البيئة الرقمية وفق الشرائح، ولماذا؟",["الرمادية، لأن الغموض يفتح الباب للتخمين ويخلق شعورًا بوجود سر مخفي","البيضاء، لأن مصدرها معلن","السوداء، لأن مصدرها واضح","كلها متساوية الخطورة"],0,"الدعاية الرمادية مصدرها غامض أو غير قابل للتحقق وتعمل عبر تسريبات ومعلومات عاجلة."],
[2,"ظهر حساب يشبه الحساب الرسمي ينسب تصريحًا لجهة لم تقله. كيف يُصنَّف؟",["دعاية بيضاء","دعاية رمادية","دعاية سوداء","علاقات عامة مضادة"],2,"الدعاية السوداء تقوم على انتحال المصدر أو تزويره (حسابات تشبه الرسمية، وثائق مفبركة، نسب تصريحات لم تُقل)."],
[2,"أي وصف ينطبق على الدعاية البيضاء؟",["مصدر مجهول ومعلومات عاجلة","مصدر معلن ومعلومات صحيحة كثيرة تُقدَّم بانتقاء شديد وإطار واحد يخفي التعقيد","تزوير للمصدر","نشر معلومات خاطئة بالكامل"],1,"تتميز بمصدر معلن وصحة معلومات كثيرة، لكن الانتقاء والإطار الواحد يضغطان نحو استنتاج بعينه."],
[2,"ما الفرق الجوهري بين الدعاية والعلاقات العامة؟",["الدعاية تراعي مصالح الجماهير أولًا","العلاقات العامة تخدم المصلحة العامة وتضع مصلحة جماهير المؤسسة أولًا، والدعاية تخدم أغراض القائم بها دون مراعاة مصالحهم","لا فرق لأن الوسائل واحدة","الدعاية تعتمد دائمًا على الحقائق الكاملة"],1,"الدعاية تسعى لدفع الجماهير لسلوك يخدم الجهة القائمة بها، بينما تقوم العلاقات العامة أساسًا على خدمة المصلحة العامة."],
[3,"مؤسسة تنشر بكثافة وتنظم مناسبات كثيرة دون سؤال: ما التغيير المطلوب في معرفة الجمهور أو اتجاهه أو سلوكه؟ أي ممارسة غير استراتيجية تمثلها؟",["رد فعل دائم","رسالة واحدة للجميع","نشاط بلا غاية قابلة للقياس","غياب الميزانية"],2,"من أسباب وصف التخطيط بـ«الاستراتيجي»: تمييزه عن النشاط بلا غاية قابلة للقياس، والتحرك الدفاعي المتأخر، والرسالة الواحدة للجميع."],
[3,"وفق «سلسلة القرار»، على ماذا تُبنى الرسالة؟",["القياس","الهدف","البحث مباشرة","الانطباع العام"],1,"الرسالة تُبنى على الهدف، والهدف على الجمهور، والجمهور على الفهم، والفهم على البحث، والنجاح على القياس."],
[3,"أي مما يلي يُعدّ «تكتيكًا» وليس استراتيجية؟",["منطق شامل لكيفية الوصول إلى التغيير","الفرضيات المعتمدة حول الجمهور","بيان صحفي أو ورشة أو فيديو","المسار الذي نسلكه للوصول للتغيير"],2,"التكتيك نشاط محدد داخل الاستراتيجية ولا يشرح وحده سبب اختياره، أما الاستراتيجية فهي الفكرة الكبرى."],
[3,"أي عبارة تصلح هدفًا قابلًا للقياس؟",["رفع الوعي بالاحتيال","تحسين الصورة الذهنية","زيادة نشاط المنصات","وصف التغيير المطلوب فعليًا بمؤشر وأداة وزمن قياس"],3,"عبارات مثل «رفع الوعي» تصلح شعارات لا أهدافًا؛ فالهدف الجيد يصف التغيير ويُربط بمؤشر وأداة قياس."],
[4,"في مصفوفة النفوذ والاهتمام، كيف يُتعامل مع جهة ذات نفوذ عالٍ واهتمام منخفض؟",["يُدار عن قرب ويُشرك في القرار","يُبقى مطلعًا دون إغراق بالتفاصيل","يُتجاهل تمامًا","تواصل عام عند الحاجة فقط"],1,"نفوذ عالٍ + اهتمام منخفض = يُبقى مطلعًا دون إغراق بالتفاصيل."],
[4,"في نموذج PESO، أي القنوات أهم لتثبيت المرجعية لأنها مصدر يعود إليه الجمهور؟",["Paid المدفوعة","Earned المكتسبة","Shared المشتركة","Owned المملوكة"],3,"المواقع والحسابات الرسمية ومراكز الخدمة قنوات مملوكة وهي أهم قنوات تثبيت المرجعية."],
[5,"أي مما يلي يمثل «أثرًا» (Impact) وليس مخرجًا أو نتيجة؟",["عدد المنشورات","انخفاض تداول الشائعة وارتفاع الامتثال على مستوى الواقع الأوسع","زيادة وضوح الإجراء لدى الجمهور","عدد اللقاءات المنفذة"],1,"المخرجات: ما ننتجه. النتائج: ما تغيّر في الجمهور. الأثر: ما تغيّر على مستوى الواقع الأوسع."],
[5,"لماذا لا يكفي عدّ المنشورات والمشاهدات لتقييم الحملة؟",["لأنها لا تفيد إعلاميًا","لأنها لا تجيب عن: هل فهم الجمهور؟ هل تغيّر سلوكه؟ هل انخفض الالتباس؟","لأن عددها دائمًا قليل","لأن التقييم يتم بعد الحملة فقط"],1,"العدّ مفيد إعلاميًا لكنه يقيس المخرجات لا النتائج والأثر، والتقييم يُصمم منذ بداية الخطة."],
[6,"أي مما يلي من الوظائف الجوهرية للبروتوكول داخل المؤسسة؟",["إظهار الترف المؤسسي","منع الإحراج وتضارب الأدوار بتوضيح من يتصدر ومن يتحدث ومتى","تقليل عدد الضيوف","الارتجال في إدارة الكلمات"],1,"وظائفه: حفظ الاحترام والرمزية الرسمية، ومنع الإحراج وتضارب الأدوار، وتثبيت صورة الانضباط المؤسسي."],
[6,"لماذا يرتبط البروتوكول بالانضباط في المؤسسات الشرطية؟",["لأن الانضباط الشكلي انعكاس لانضباط الأداء ويؤثر مباشرة في الثقة العامة","لأنه يقلل مهام الضباط","لأنه يخص المناسبات الاجتماعية فقط","لأنه بديل عن العلاقات العامة"],0,"خطأ صغير في ترتيب الوفود أو مخاطبة جهة رسمية قد يخلّف أثرًا أكبر من حجم الخطأ ذاته."],
[3,"بماذا تُقاس «قابلية تنفيذ» الخطة وفق الشرائح؟",["بكثرة صفحاتها","بعناصر تشغيلية: تشخيص واقعي، جمهور محدد، هدف قابل للقياس، استراتيجية رابطة، آلية تقييم","بعدد الأنشطة المخططة","بحجم الميزانية"],1,"غياب أي سمة من السمات الخمس يضعف قدرة الخطة على العمل."],
[3,"بيانات الشكاوى وملاحظات موظفي الصف الأول وأسئلة مراكز الخدمة تنتمي إلى أي دائرة بحث؟",["بحث داخلي","بحث خارجي","بحث قانوني وإجرائي","بحث أكاديمي"],0,"البحث الداخلي يشمل تقارير الأداء والشكاوى والاستفسارات وملاحظات الصف الأول."],
[3,"أي سؤال يعالجه البحث القانوني والإجرائي؟",["ما الرأي العام السائد؟","ما الذي يجوز قوله ومتى يجوز الإفصاح دون الإضرار بالإجراءات أو الخصوصية؟","كم عدد المتابعين؟","ما القناة الأقل تكلفة؟"],1,"يحدد حدود القول والإفصاح وكيفية الإجابة بشفافية دون الإضرار بالإجراءات."],
[3,"من أين تبدأ حملة التوعية بالاحتيال الرقمي وفق المثال التدريبي؟",["بكتابة نص توعوي عام","بتحديد أكثر الأسئلة تكرارًا ونقاط الالتباس في إجراء البلاغ وأسباب تأخر الإبلاغ","بشراء مساحة إعلانية","بالتخويف والتهويل"],1,"تُبنى الرسالة على تبسيط الإجراء ورفع الثقة لا على التخويف."],
[3,"ما الغاية من تحليل الوضع؟",["إنتاج ورقة تحليلية فقط","اتخاذ قرار اتصالي أفضل","إثبات وجود مشكلة","استبدال البحث"],1,"يمنع التحليل أن تكون الخطة رغبة أو توقعًا غير واقعي."],
[3,"أي مما يلي يُصنَّف «فرصة» عند تحليل الوضع؟",["غموض لغة الإجراء","تأخر تحديث المعلومات","تضارب المصادر","شراكات وقنوات موثوقة ومناسبات مجتمعية"],3,"الفرص المتاحة تشمل الشراكات والقنوات الموثوقة والمناسبات المجتمعية."],

const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const L="أبجد";let S;
function start(train){S={train,cur:0,done:false,qs:sh(Q).map(q=>{const o=sh(q[2].map((t,i)=>({t,ok:i==q[3]})));return{tp:q[0],q:q[1],o,ex:q[4]}}),a:[]};S.a=S.qs.map(()=>-1);quiz()}
function home(){app.innerHTML=`<div class="card"><h1>اختبار العلاقات العامة والإعلام الأمني</h1><p class="mu">اختبار تفاعلي مبني على محتوى الشرائح المرفقة فقط: التعريفات، التمييز بين الإعلام والإعلان والدعاية، التخطيط الاستراتيجي، والبروتوكول.</p><p><b>عدد الأسئلة:</b> ${Q.length} &nbsp; <b>المستوى:</b> متوسط إلى صعب</p><p class="mu">تُحتسب النتيجة في النهاية، ولا تظهر الإجابات الصحيحة قبل إنهاء الاختبار (ما لم تختر وضع التدريب).</p><label class="m"><input type="checkbox" id="tm" style="width:20px;height:20px"> وضع التدريب (تظهر الإجابة والشرح بعد كل سؤال)</label><button class="p" style="width:100%" onclick="start($('#tm').checked)">ابدأ الاختبار</button></div>`}
function quiz(){const q=S.qs[S.cur],n=S.qs.length,a=S.a[S.cur],lock=S.train&&a>=0;
app.innerHTML=`<div class="card"><div class="row" style="align-items:center"><b>السؤال ${S.cur+1} من ${n}</b><span class="mu" style="text-align:left">${S.a.filter(x=>x>=0).length} مُجاب</span></div><div class="bar"><i style="width:${(S.cur+1)/n*100}%"></i></div>
${S.warn?`<p class="r"><b>لديك ${S.a.filter(x=>x<0).length} سؤال بلا إجابة. اضغط «إنهاء الاختبار» مرة أخرى للتأكيد.</b></p>`:""}<h2>${q.q}</h2>${q.o.map((o,i)=>`<button class="opt ${a==i?'sel':''} ${lock?(o.ok?'ok':a==i?'no':''):''}" ${lock?'disabled':''} onclick="pick(${i})">${L[i]}) ${o.t}</button>`).join("")}
${lock?`<div class="ex"><b class="${q.o[a].ok?'g':'r'}">${q.o[a].ok?'إجابة صحيحة':'إجابة خاطئة'}</b><br>${q.ex}</div>`:""}
<div class="row" style="margin-top:14px"><button onclick="go(-1)" ${S.cur?'':'disabled'}>السابق</button>${S.cur<n-1?`<button class="p" onclick="go(1)">التالي</button>`:`<button class="p" onclick="finish()">إنهاء الاختبار</button>`}</div>
<div class="grid">${S.qs.map((_,i)=>`<button class="${S.a[i]>=0?'d':''}" onclick="S.cur=${i};quiz()">${i+1}</button>`).join("")}</div></div>`}
function pick(i){S.warn=0;if(S.train&&S.a[S.cur]>=0)return;S.a[S.cur]=i;quiz()}
function go(d){S.cur+=d;quiz();scrollTo(0,0)}
function finish(){const un=S.a.filter(x=>x<0).length;if(un&&!S.warn){S.warn=1;quiz();scrollTo(0,0);return}S.done=true;result()}
function result(){const n=S.qs.length,ok=S.qs.filter((q,i)=>S.a[i]>=0&&q.o[S.a[i]].ok).length,p=ok/n*100,lv=p>=90?"ممتاز":p>=75?"جيد جدًا":p>=60?"جيد":"يحتاج إلى مراجعة";
const tp=T.map((t,k)=>{const ix=S.qs.map((q,i)=>q.tp==k?i:-1).filter(i=>i>=0);const c=ix.filter(i=>S.a[i]>=0&&S.qs[i].o[S.a[i]].ok).length;return{t,c,n:ix.length}}).filter(x=>x.n);
const grp=f=>tp.filter(f).map(x=>x.t).join("، ")||"—";
app.innerHTML=`<div class="card" style="text-align:center"><h1>النتيجة</h1><div class="big">${ok} / ${n} — ${p.toFixed(1)}%</div><h2>${lv}</h2></div>
<div class="card"><h2>تحليل الأداء حسب الموضوع</h2>${tp.map(x=>`<div>${x.t}: <b>${x.c}/${x.n}</b><div class="bar"><i style="width:${x.c/x.n*100}%"></i></div></div>`).join("")}
<p><b class="g">مواضيع أتقنتها:</b> ${grp(x=>x.c/x.n>=.8)}</p><p><b>تحتاج مراجعة:</b> ${grp(x=>x.c/x.n>=.5&&x.c/x.n<.8)}</p><p><b class="r">نسبة الخطأ فيها مرتفعة:</b> ${grp(x=>x.c/x.n<.5)}</p></div>
<div class="card"><h2>مراجعة الإجابات</h2>${S.qs.map((q,i)=>{const a=S.a[i],g=a>=0&&q.o[a].ok;return`<div class="ex"><span class="tag">${i+1} • ${T[q.tp]}</span><br><b>${q.q}</b><br>إجابتك: ${a>=0?q.o[a].t:"لم تُجب"} <b class="${g?'g':'r'}">${g?'✔ صحيحة':'✘ خاطئة'}</b><br>الإجابة الصحيحة: ${q.o.find(o=>o.ok).t}<br><span class="mu">${q.ex}</span></div>`}).join("")}</div>
<button class="p" style="width:100%" onclick="start(S.train)">إعادة الاختبار</button>`;scrollTo(0,0)}
home();
</script>
